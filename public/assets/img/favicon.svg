<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="간다GO 돌하르방 파비콘">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E5A50"/>
      <stop offset="1" stop-color="#0A423B"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4DFD3"/>
      <stop offset="1" stop-color="#C7C1B3"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.4" fill="none" stroke="#D9B76A" stroke-opacity="0.55" stroke-width="1.2"/>

  <!-- 벙거지(모자) -->
  <ellipse cx="32" cy="18" rx="21" ry="8.5" fill="#A9A294"/>
  <path d="M18 17 C18 9, 46 9, 46 17 Z" fill="#B4AD9E"/>

  <!-- 얼굴(머리) -->
  <path d="M14 30 C14 20, 50 20, 50 30 L50 44 C50 55, 40 60, 32 60 C24 60, 14 55, 14 44 Z" fill="url(#stone)"/>

  <!-- 눈 (돌출된 둥근 눈) -->
  <circle cx="24" cy="33" r="5.4" fill="#EFEBE1"/>
  <circle cx="40" cy="33" r="5.4" fill="#EFEBE1"/>
  <circle cx="24" cy="33.5" r="2.5" fill="#26292E"/>
  <circle cx="40" cy="33.5" r="2.5" fill="#26292E"/>

  <!-- 코 (돌하르방 상징: 크고 뭉툭한 코) -->
  <path d="M32 35 C26 41, 26.5 52, 32 52 C37.5 52, 38 41, 32 35 Z" fill="#BDB6A6"/>

  <!-- 입 -->
  <path d="M26 55 Q32 59 38 55" fill="none" stroke="#3A3A38" stroke-width="2.4" stroke-linecap="round"/>
</svg>
