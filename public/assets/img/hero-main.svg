<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-label="제주 바다와 한라산을 배경으로 한 숙소 지역 안내 이미지">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e5a50"/>
      <stop offset="0.55" stop-color="#12786b"/>
      <stop offset="1" stop-color="#1a9e8b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a9e8b"/>
      <stop offset="1" stop-color="#0a423b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d488"/>
      <stop offset="1" stop-color="#c6a15b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="720" height="560" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="720" height="560" fill="url(#sky)"/>
    <!-- sun -->
    <circle cx="540" cy="150" r="70" fill="url(#sun)" opacity="0.95"/>
    <circle cx="540" cy="150" r="98" fill="none" stroke="#f7d488" stroke-opacity="0.25" stroke-width="2"/>

    <!-- 한라산 실루엣 -->
    <path d="M-20 330 L150 210 C200 176 250 176 300 208 L430 300 C470 328 520 330 560 306 L740 210 L740 360 L-20 360 Z" fill="#0a423b" opacity="0.55"/>
    <path d="M-20 360 L120 268 C180 232 240 232 300 270 L410 338 C460 368 520 368 570 340 L740 250 L740 400 L-20 400 Z" fill="#08322c" opacity="0.7"/>

    <!-- 바다 -->
    <rect y="392" width="720" height="168" fill="url(#sea)"/>
    <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="2" fill="none">
      <path d="M60 430 q30 -10 60 0 t60 0"/>
      <path d="M360 452 q30 -10 60 0 t60 0"/>
      <path d="M200 490 q30 -10 60 0 t60 0"/>
      <path d="M470 500 q30 -10 60 0 t60 0"/>
    </g>

    <!-- 프리미엄 유리 카드(숙소 안내 암시) -->
    <g>
      <rect x="70" y="360" width="220" height="150" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.28"/>
      <rect x="94" y="388" width="90" height="10" rx="5" fill="#ffffff" fill-opacity="0.85"/>
      <rect x="94" y="410" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.5"/>
      <rect x="94" y="428" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.5"/>
      <rect x="94" y="462" width="120" height="30" rx="15" fill="#f97316"/>
      <text x="154" y="482" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#ffffff">예약 문의</text>
    </g>

    <!-- 골드 액센트 라인 -->
    <rect x="0" y="0" width="720" height="6" fill="#c6a15b" opacity="0.9"/>
  </g>
</svg>
