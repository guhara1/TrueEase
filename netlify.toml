# Netlify 배포 설정
# - 무의존성 Node 생성기로 빌드 후 public/ 을 게시합니다.

[build]
  command = "node build.js"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

# 루트 접속을 제주 메인으로 연결
[[redirects]]
  from = "/"
  to = "/jeju/"
  status = 301
  force = false

# 정적 자산 캐싱
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
