# Netlify 배포 설정
# - 무의존성 Node 생성기로 빌드 후 public/ 을 게시합니다.

[build]
  command = "node build.js"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

# 구 홈 경로(/jeju/)를 루트로 연결 (홈은 이제 / 입니다)
[[redirects]]
  from = "/jeju"
  to = "/"
  status = 301
  force = false

[[redirects]]
  from = "/jeju/"
  to = "/"
  status = 301
  force = false

# 정적 자산 캐싱
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
